# Build every font and check it with FontBakery on each push to main and on pull requests.
# A tag such as 1.000 also publishes a GitHub release with the zip of the fonts,
# but only when every check passed. With the repository variable PAGES set to true, each
# push to main also publishes the specimen page, the proofs and the FontBakery reports on
# GitHub Pages (Settings > Pages > Source: GitHub Actions).
name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["[0-9]+.[0-9]+"]     # the font version, as Google Fonts asks: 1.000, 1.001 ...

permissions:
  contents: write     # to create the release

jobs:
  build:
    name: Build the fonts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.13"
      - uses: actions/cache@v5
        with:
          path: ./venv/
          key: ${{ runner.os }}-venv${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}
      - uses: actions/cache@v5
        with:
          path: ./venv-test/
          key: ${{ runner.os }}-venv-test${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements-test.txt') }}
      - name: Check that the UFO sources match the generator
        run: make check-sources
      - name: Build the fonts
        run: make build
      - name: Upload the fonts
        uses: actions/upload-artifact@v6
        with:
          name: trica-neon-fonts
          path: fonts
      - name: Check the fonts with FontBakery
        run: make test
      - name: Make the proofs and the specimen page
        if: ${{ !cancelled() }}
        run: make proof specimen
      - name: Upload the FontBakery reports, the proofs and the specimen page
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: trica-neon-reports
          path: out
      - name: Prepare the GitHub Pages site
        if: vars.PAGES == 'true' && github.ref == 'refs/heads/main'
        run: |
          cp -R out/specimen site
          cp -R out/proof site/proof
          cp -R out/fontbakery site/fontbakery
      - name: Upload the GitHub Pages site
        if: vars.PAGES == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          test "$TAG" = "$(make -s version)" || { echo "tag $TAG does not match the font version $(make -s version)"; exit 1; }
          make release
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Changes: see FONTLOG.txt."
          gh release upload "$TAG" release/trica-neon-*.zip --clobber

  pages:
    name: Publish the specimen page
    needs: build
    if: vars.PAGES == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write        # to deploy to GitHub Pages
      id-token: write     # to verify the deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
